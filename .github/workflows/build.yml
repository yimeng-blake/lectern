# Builds Lectern on the oldest supported macOS and on a newer one, with each runner's default
# toolchain, to check the "macOS 14 / Swift 5.10+" claims. It doesn't run the app.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version
      - name: Debug build (all targets)
        run: swift build
      - name: App bundle
        run: bash scripts/build-app.sh
      - name: Check the bundle
        run: |
          lipo -archs build/Lectern.app/Contents/MacOS/Lectern
          codesign --verify --deep --strict build/Lectern.app
